# Builds the macOS artifact and attaches it to a GitHub Release (WCLI-82,
# DEC-246, WCLI-123, DEC-253 (a4)).
#
# The release is a pushed v* tag. The build job runs on a GitHub-hosted macOS
# runner, because the binary has to be signed by macOS itself: the Linux
# cross-build of the darwin target FAILED codesign --verify --strict (DEC-255)
# and is retired from this path. In that one job it builds under the fixed name
# `ward` (the compiled bytes depend on the output file name), renames it for the
# release, ad-hoc signs it with `codesign -s - --force`, runs
# `codesign --verify --strict --verbose=2`, and checks that codesign's CDHash
# and scripts/macho-cdhash.mjs agree, all before anything is uploaded. The
# checksum and the notes' sha256 and cdhash are then written from those signed
# bytes. The signing recipe is the DEC-255 (1) sitting's, recorded in
# docs/runbooks/publish-a-mac-signed-ward-release-asset.md.
#
# workflow_dispatch is a dry run: it builds, signs, verifies, hashes and uploads
# the artifact to the run, and creates no Release. The Release is created by one
# job, the only one that holds contents: write.
#
# The verify job below re-downloads the uploaded artifact and runs
# codesign --verify --strict again, and the release job needs it, so a signature
# that does not verify cannot publish. While the repository was private the
# verify job only logged that it skipped (DEC-253 (a2), WCLI-120).
#
# Billing is read after each tag run by the operator, not here: the release
# runbook reads /actions/runs/<id>/timing and MACOS billable must be 0
# (DEC-253 (a4)); if not, ward-cli stops and reports.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build darwin-arm64
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      # Full history, so a tag push can be checked against main below. The
      # checkout already carries origin/main and the tags; this job never
      # fetches or pushes.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: The tag names this package's version and is main's tip
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::${TAG} is not on main: promote dev to main before tagging"
            exit 1
          fi
          if [ "$tag_commit" != "$(git rev-parse origin/main)" ]; then
            echo "::error::${TAG} does not point at main's tip: AC1 requires main == dev, so a tag behind the tip is not this release"
            exit 1
          fi
      # Annotated-ness is read from the stored ref, not from the checkout: what
      # actions/checkout leaves at refs/tags/<tag> is what the old
      # `git cat-file -t` was trusting, and for an annotated tag that object
      # can be the commit. The script says why in full.
      - name: The tag is an annotated tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release-tag.mjs
      # The release job uses node and the REST API, not a third-party release action.
      - run: node --version
      - name: Install with the darwin native module
        run: bun install --frozen-lockfile --os=darwin --cpu=arm64
      # The build script owns the flags, so what ships is what the tests measure.
      - name: Build the executable under the fixed name ward
        run: |
          set -euo pipefail
          mkdir out
          bun scripts/build.ts --target bun-darwin-arm64 --outfile out/ward
          ls -l out/ward
      # Signed on the machine that will judge it, and judged before upload: a
      # signature that fails here stops the job, so nothing unsigned or
      # mis-signed is uploaded. The two cdhash readers must agree, because the
      # notes carry the one from scripts/macho-cdhash.mjs (DEC-255 (1)).
      - name: Ad-hoc sign it, verify it strictly and check the cdhash
        run: |
          set -euo pipefail
          cd out
          mv ward ward-darwin-arm64
          codesign -s - --force ward-darwin-arm64
          codesign --verify --strict --verbose=2 ward-darwin-arm64
          signed="$(codesign -dvvv ward-darwin-arm64 2>&1 | sed -n 's/^CDHash=//p')"
          computed="$(node ../scripts/macho-cdhash.mjs ward-darwin-arm64)"
          echo "codesign CDHash=${signed} macho-cdhash=${computed}"
          if [ -z "$signed" ] || [ "$signed" != "$computed" ]; then
            echo "::error::codesign and scripts/macho-cdhash.mjs disagree on the cdhash"
            exit 1
          fi
      # Hashes the SIGNED bytes from the step above, so the checksum, the
      # notes' sha256 and the notes' cdhash all name what is published.
      - name: Hash it and write the release notes
        env:
          SOURCE_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The notes carry the re-approval warning only for a release that
          # actually raises the version, compared against the previous v* tag
          # (1 is the pre-release baseline every dev-era build wrote).
          snapshot_version_now="$(sed -n 's/^export const profileSnapshotVersion = \([0-9][0-9]*\);$/\1/p' src/domain/profile.ts)"
          if [ -z "$snapshot_version_now" ]; then
            echo "::error::could not read profileSnapshotVersion from src/domain/profile.ts"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            baseline="refs/tags/${REF_NAME}^{commit}^"
          else
            baseline="HEAD"
          fi
          # The previous v* tag reachable from the baseline, highest version
          # first, or nothing.
          #
          # `git describe` cannot answer this question. It dies whenever the
          # baseline has no matching tag, which is every first release — and on
          # the tag run the baseline is the tag's own parent, so v0.1.0 itself
          # can never describe it. Its failure therefore has to be read as a
          # result, which is exactly the trap finding 11 was about, and the
          # dry run hides it because a dry run has no v* tags at all.
          #
          # `git tag --merged` separates the two cases by exit code instead of
          # by message: nothing reachable lists nothing and exits 0, and a real
          # failure exits non-zero, which `set -e` turns into a failed step.
          tags="$(git tag --list 'v*' --merged "$baseline" --sort=-v:refname)"
          previous_tag="${tags%%$'\n'*}"
          snapshot_version_before=1
          if [ -n "$previous_tag" ]; then
            snapshot_version_before="$(git show "${previous_tag}:src/domain/profile.ts" | sed -n 's/^export const profileSnapshotVersion = \([0-9][0-9]*\);$/\1/p')"
            if [ -z "$snapshot_version_before" ]; then
              echo "::error::could not read profileSnapshotVersion at ${previous_tag}"
              exit 1
            fi
          fi
          if [ "$snapshot_version_now" -gt "$snapshot_version_before" ]; then
            snapshot_bump="This release raises the profile snapshot version: approve your profiles again after installing."
          else
            snapshot_bump=""
          fi
          cd out
          shasum -a 256 ward-darwin-arm64 > ward-darwin-arm64.sha256
          sha256="$(cut -d' ' -f1 ward-darwin-arm64.sha256)"
          cdhash="$(node ../scripts/macho-cdhash.mjs ward-darwin-arm64)"
          {
            echo "Ward ${REF_NAME}, local developer preview, macOS on Apple silicon."
            echo
            echo "- Source: ${SOURCE_SHA}"
            echo "- sha256 ward-darwin-arm64: ${sha256}"
            echo "- cdhash (ad-hoc signature, macOS keychain trust follows it): ${cdhash}"
            echo
            echo "Install and upgrade: https://github.com/${REPO}/blob/${REF_NAME}/docs/runbooks/install-and-upgrade-ward-from-a-release.md"
            if [ -n "$snapshot_bump" ]; then
              echo "$snapshot_bump"
            fi
            echo "Published as a full Release, not a GitHub pre-release: it is the only release for this tag, and the install steps download it by tag. It is still a local developer preview with no stability promise."
            echo "Expect one keychain re-approval per upgrade; the binary is ad-hoc signed."
          } > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ward-darwin-arm64
          path: |
            out/ward-darwin-arm64
            out/ward-darwin-arm64.sha256
            out/release-notes.md
          if-no-files-found: error

  # WCLI-96 (W-1, DEC-253): the release is gated on macOS's own verdict on the
  # signature. The Linux build cannot run codesign, and a published v0.1.0 whose
  # sha256 matched its manifest still failed `codesign --verify --strict`. Once
  # the repository is public this job downloads the exact artifact the release
  # would publish, on a GitHub-hosted macOS runner (a self-hosted one is not
  # used for a repository that is public), and the release job needs it, so a
  # signature that does not verify cannot be published. It runs on a release tag
  # and on a manual dry run (DEC-253 (a1)); only the release job is tag-only, so
  # a dry run can never publish.
  #
  # While the repository is private (DEC-253 (a2), WCLI-120) the gate is the
  # publish runbook's strict verify of the downloaded Release after the tag,
  # and this job must not queue a billed macOS run. It still runs, so the
  # release job's needs is met without a status function in its condition, but
  # on the self-hosted Linux runner, takes no step but a notice, and says why
  # the hosted check was skipped. The visibility is read from the event's
  # repository payload and fails closed: only an explicit `private == true`
  # skips, so a payload without the field takes the public, verifying path.
  # After the flip the same expression resolves to macos-15 with no edit.
  verify:
    name: Verify the code signature on macOS
    needs: build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ${{ github.event.repository.private == true && fromJSON('["self-hosted","Linux","ARM64"]') || 'macos-15' }}
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: The hosted macOS check is skipped while the repository is private
        if: github.event.repository.private == true
        run: |
          echo "::notice::codesign --verify --strict is skipped here while the repository is private (DEC-253 (a2)). The gate is the publish runbook's strict verify of the downloaded Release after the tag; it is required here again once the repository is public."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event.repository.private != true
        with:
          name: ward-darwin-arm64
          path: out
      - name: codesign verifies the signature strictly
        if: github.event.repository.private != true
        run: codesign --verify --strict --verbose=2 out/ward-darwin-arm64

  release:
    name: Create the GitHub Release
    needs: [build, verify]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    # The only write permission in this workflow: it creates the Release.
    permissions:
      contents: write
    steps:
      # The script that publishes comes from the tagged commit, not the artifact.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ward-darwin-arm64
          path: out
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd out && sha256sum --check ward-darwin-arm64.sha256)
          node scripts/publish-release.mjs out/release-notes.md \
            out/ward-darwin-arm64 out/ward-darwin-arm64.sha256
