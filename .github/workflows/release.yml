# Builds the macOS artifact and attaches it to a GitHub Release (WCLI-82,
# DEC-246).
#
# The release is a pushed v* tag. The build runs on the self-hosted Linux ARM64
# runner and cross-compiles for darwin-arm64: measured on 2026-10-26, the
# runner's bytes equal a Mac's for the same source and output name, and the
# compiled bytes depend on the output file name, so the executable is always
# built under the fixed name `ward` and only then renamed for the release.
#
# workflow_dispatch is a dry run: it builds, hashes and uploads the artifact to
# the run, and creates no Release. The Release is created by one job, the only
# one that holds contents: write.
#
# The binary is ad-hoc signed by the compiler. codesign is not available on
# Linux, so the cdhash the notes carry is read from the Mach-O itself by
# scripts/macho-cdhash.mjs, which test/release-workflow.test.ts checks against
# codesign when it runs on a Mac.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build darwin-arm64
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 15
    steps:
      # Full history, so a tag push can be checked against main below. The
      # checkout already carries origin/main and the tags; this job never
      # fetches or pushes.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: The tag names this package's version and is main's tip
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::${TAG} is not on main: promote dev to main before tagging"
            exit 1
          fi
          if [ "$tag_commit" != "$(git rev-parse origin/main)" ]; then
            echo "::error::${TAG} does not point at main's tip: AC1 requires main == dev, so a tag behind the tip is not this release"
            exit 1
          fi
      # Annotated-ness is read from the stored ref, not from the checkout: what
      # actions/checkout leaves at refs/tags/<tag> is what the old
      # `git cat-file -t` was trusting, and for an annotated tag that object
      # can be the commit. The script says why in full.
      - name: The tag is an annotated tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release-tag.mjs
      # The runner has no gh, so the release job uses node and the REST API.
      - run: node --version
      - name: Install with the darwin native module
        run: bun install --frozen-lockfile --os=darwin --cpu=arm64
      # The build script owns the flags, so what ships is what the tests measure.
      - name: Build the executable under the fixed name ward
        run: |
          set -euo pipefail
          mkdir out
          bun scripts/build.ts --target bun-darwin-arm64 --outfile out/ward
          ls -l out/ward
      - name: Hash it and write the release notes
        env:
          SOURCE_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          RUNNER_HOST: ${{ runner.name }}
        run: |
          set -euo pipefail
          # The notes carry the re-approval warning only for a release that
          # actually raises the version, compared against the previous v* tag
          # (1 is the pre-release baseline every dev-era build wrote).
          snapshot_version_now="$(sed -n 's/^export const profileSnapshotVersion = \([0-9][0-9]*\);$/\1/p' src/domain/profile.ts)"
          if [ -z "$snapshot_version_now" ]; then
            echo "::error::could not read profileSnapshotVersion from src/domain/profile.ts"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            baseline="refs/tags/${REF_NAME}^{commit}^"
          else
            baseline="HEAD"
          fi
          # The previous v* tag reachable from the baseline, highest version
          # first, or nothing.
          #
          # `git describe` cannot answer this question. It dies whenever the
          # baseline has no matching tag, which is every first release — and on
          # the tag run the baseline is the tag's own parent, so v0.1.0 itself
          # can never describe it. Its failure therefore has to be read as a
          # result, which is exactly the trap finding 11 was about, and the
          # dry run hides it because a dry run has no v* tags at all.
          #
          # `git tag --merged` separates the two cases by exit code instead of
          # by message: nothing reachable lists nothing and exits 0, and a real
          # failure exits non-zero, which `set -e` turns into a failed step.
          tags="$(git tag --list 'v*' --merged "$baseline" --sort=-v:refname)"
          previous_tag="${tags%%$'\n'*}"
          snapshot_version_before=1
          if [ -n "$previous_tag" ]; then
            snapshot_version_before="$(git show "${previous_tag}:src/domain/profile.ts" | sed -n 's/^export const profileSnapshotVersion = \([0-9][0-9]*\);$/\1/p')"
            if [ -z "$snapshot_version_before" ]; then
              echo "::error::could not read profileSnapshotVersion at ${previous_tag}"
              exit 1
            fi
          fi
          if [ "$snapshot_version_now" -gt "$snapshot_version_before" ]; then
            snapshot_bump="This release raises the profile snapshot version: approve your profiles again after installing."
          else
            snapshot_bump=""
          fi
          cd out
          mv ward ward-darwin-arm64
          sha256sum ward-darwin-arm64 > ward-darwin-arm64.sha256
          sha256="$(cut -d' ' -f1 ward-darwin-arm64.sha256)"
          cdhash="$(node ../scripts/macho-cdhash.mjs ward-darwin-arm64)"
          {
            echo "Ward ${REF_NAME}, local developer preview, macOS on Apple silicon."
            echo
            echo "- Source: ${SOURCE_SHA}"
            echo "- sha256 ward-darwin-arm64: ${sha256}"
            echo "- cdhash (ad-hoc signature, macOS keychain trust follows it): ${cdhash}"
            echo "- Built on runner ${RUNNER_HOST}, $(uname -srm), bun $(bun --version), cross-compiled for bun-darwin-arm64 under the output name ward"
            echo
            echo "Install and upgrade: https://github.com/${REPO}/blob/${REF_NAME}/docs/runbooks/install-and-upgrade-ward-from-a-release.md"
            if [ -n "$snapshot_bump" ]; then
              echo "$snapshot_bump"
            fi
            echo "Published as a full Release, not a GitHub pre-release: it is the only release for this tag, and the install steps download it by tag. It is still a local developer preview with no stability promise."
            echo "Expect one keychain re-approval per upgrade; the binary is ad-hoc signed."
          } > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ward-darwin-arm64
          path: |
            out/ward-darwin-arm64
            out/ward-darwin-arm64.sha256
            out/release-notes.md
          if-no-files-found: error

  # WCLI-96 (W-1, DEC-253): the release is gated on macOS's own verdict on the
  # signature. The Linux build cannot run codesign, and a published v0.1.0 whose
  # sha256 matched its manifest still failed `codesign --verify --strict`. This
  # job downloads the exact artifact the release would publish, on a GitHub-hosted
  # runner (a self-hosted one is not used for a repository that may go public),
  # and the release job needs it, so a signature that does not verify cannot be
  # published. It runs on a release tag only, as the release job does.
  verify:
    name: Verify the code signature on macOS
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ward-darwin-arm64
          path: out
      - name: codesign verifies the signature strictly
        run: codesign --verify --strict --verbose=2 out/ward-darwin-arm64

  release:
    name: Create the GitHub Release
    needs: [build, verify]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    # The only write permission in this workflow: it creates the Release.
    permissions:
      contents: write
    steps:
      # The script that publishes comes from the tagged commit, not the artifact.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ward-darwin-arm64
          path: out
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd out && sha256sum --check ward-darwin-arm64.sha256)
          node scripts/publish-release.mjs out/release-notes.md \
            out/ward-darwin-arm64 out/ward-darwin-arm64.sha256
