# Builds the macOS artifact and attaches it to a GitHub Release (WCLI-82,
# DEC-246, WCLI-123, DEC-253 (a4)).
#
# The release is a pushed v* tag. The build job runs on a GitHub-hosted macOS
# runner, because the binary has to be signed by macOS itself: the Linux
# cross-build of the darwin target FAILED codesign --verify --strict (DEC-255)
# and is retired from this path. In that one job it builds under the fixed name
# `ward` (the compiled bytes depend on the output file name), renames it for the
# release, ad-hoc signs it with `codesign -s - --force`, runs
# `codesign --verify --strict --verbose=2`, and checks that codesign's CDHash
# and scripts/macho-cdhash.mjs agree, all before anything is uploaded. The
# checksum and the notes' sha256 and cdhash are then written from those signed
# bytes. The signing recipe is the DEC-255 (1) sitting's, recorded in
# docs/runbooks/publish-a-mac-signed-ward-release-asset.md.
#
# The build job's artifact is ad hoc signed. The sign job (WCLI-185, DEC-301 item
# 1) re-signs it with the Developer ID identity, notarizes it and uploads
# ward-darwin-arm64-signed; verify, attest and release act on that artifact.
#
# workflow_dispatch is a dry run: from a branch it builds and uploads the
# ad-hoc artifact to the run; from main it also signs and notarizes (the
# rehearsal); it never creates a Release. The Release is created by one job, the
# only one that holds contents: write.
#
# The verify job below re-downloads the signed artifact and runs
# codesign --verify --strict again, and the release job needs it, so a signature
# that does not verify cannot publish. While the repository was private the
# verify job only logged that it skipped (DEC-253 (a2), WCLI-120).
#
# Billing is read after each tag run by the operator, not here: the release
# runbook reads /actions/runs/<id>/timing and MACOS billable must be 0
# (DEC-253 (a4)); if not, ward-cli stops and reports.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build darwin-arm64
    runs-on: macos-15
    timeout-minutes: 15
    # checks: read is for the dev-gate step below, which reads the tagged
    # commit's check runs; nothing here can write.
    permissions:
      contents: read
      checks: read
    steps:
      # Full history, so a tag push can be checked against main and dev below.
      # The checkout already carries origin/main, origin/dev and the tags; this
      # job never fetches or pushes.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: The tag names this package's version and is main's tip
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${version}" ]; then
            echo "::error::tag ${TAG} does not match package.json version ${version}"
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "::error::${TAG} is not on main: promote dev to main before tagging"
            exit 1
          fi
          if [ "$tag_commit" != "$(git rev-parse origin/main)" ]; then
            echo "::error::${TAG} does not point at main's tip: AC1 requires main == dev, so a tag behind the tip is not this release"
            exit 1
          fi
      # WCLI-103 (W-8): a guard against a mistaken tag, NOT a control against a
      # writer. A tag push runs this file as it exists at the tagged commit, so
      # whoever can push a commit and a tag can delete this step in that same
      # commit. The control is the main and tag rulesets the operator applies
      # (docs/runbooks/protect-the-release-path.md). What this step does is
      # refuse a tag whose commit is not on dev, which is reachable only through
      # a pull request, or has not got a green run of each check the dev
      # ruleset requires.
      - name: The tagged commit is on gated dev and passed its required checks
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/dev; then
            echo "::error::${TAG} is not on dev: only a commit that reached the gated dev can be released"
            exit 1
          fi
          SHA="$tag_commit" node scripts/check-release-gated.mjs
      # Annotated-ness is read from the stored ref, not from the checkout: what
      # actions/checkout leaves at refs/tags/<tag> is what the old
      # `git cat-file -t` was trusting, and for an annotated tag that object
      # can be the commit. The script says why in full.
      - name: The tag is an annotated tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: node scripts/check-release-tag.mjs
      # The release job uses node and the REST API, not a third-party release action.
      - run: node --version
      - name: Install with the darwin native module
        run: bun install --frozen-lockfile --os=darwin --cpu=arm64
      # The build script owns the flags, so what ships is what the tests measure.
      - name: Build the executable under the fixed name ward
        run: |
          set -euo pipefail
          mkdir out
          bun scripts/build.ts --target bun-darwin-arm64 --outfile out/ward
          ls -l out/ward
      # Signed on the machine that will judge it, and judged before upload: a
      # signature that fails here stops the job, so nothing unsigned or
      # mis-signed is uploaded. The two cdhash readers must agree, because the
      # notes carry the one from scripts/macho-cdhash.mjs (DEC-255 (1)).
      - name: Ad-hoc sign it, verify it strictly and check the cdhash
        run: |
          set -euo pipefail
          cd out
          mv ward ward-darwin-arm64
          codesign -s - --force ward-darwin-arm64
          codesign --verify --strict --verbose=2 ward-darwin-arm64
          signed="$(codesign -dvvv ward-darwin-arm64 2>&1 | sed -n 's/^CDHash=//p')"
          computed="$(node ../scripts/macho-cdhash.mjs ward-darwin-arm64)"
          echo "codesign CDHash=${signed} macho-cdhash=${computed}"
          if [ -z "$signed" ] || [ "$signed" != "$computed" ]; then
            echo "::error::codesign and scripts/macho-cdhash.mjs disagree on the cdhash"
            exit 1
          fi
      # Hashes the SIGNED bytes from the step above, so the checksum, the
      # notes' sha256 and the notes' cdhash all name what is published.
      - name: Hash it and write the release notes
        env:
          SOURCE_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The notes carry the re-approval warning only for a release that
          # actually raises the version, compared against the previous v* tag
          # (1 is the pre-release baseline every dev-era build wrote).
          snapshot_version_now="$(sed -n 's/^export const profileSnapshotVersion = \([0-9][0-9]*\);$/\1/p' src/domain/profile.ts)"
          if [ -z "$snapshot_version_now" ]; then
            echo "::error::could not read profileSnapshotVersion from src/domain/profile.ts"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            baseline="refs/tags/${REF_NAME}^{commit}^"
          else
            baseline="HEAD"
          fi
          # The previous v* tag reachable from the baseline, highest version
          # first, or nothing.
          #
          # `git describe` cannot answer this question. It dies whenever the
          # baseline has no matching tag, which is every first release — and on
          # the tag run the baseline is the tag's own parent, so v0.1.0 itself
          # can never describe it. Its failure therefore has to be read as a
          # result, which is exactly the trap finding 11 was about, and the
          # dry run hides it because a dry run has no v* tags at all.
          #
          # `git tag --merged` separates the two cases by exit code instead of
          # by message: nothing reachable lists nothing and exits 0, and a real
          # failure exits non-zero, which `set -e` turns into a failed step.
          tags="$(git tag --list 'v*' --merged "$baseline" --sort=-v:refname)"
          previous_tag="${tags%%$'\n'*}"
          snapshot_version_before=1
          if [ -n "$previous_tag" ]; then
            snapshot_version_before="$(git show "${previous_tag}:src/domain/profile.ts" | sed -n 's/^export const profileSnapshotVersion = \([0-9][0-9]*\);$/\1/p')"
            if [ -z "$snapshot_version_before" ]; then
              echo "::error::could not read profileSnapshotVersion at ${previous_tag}"
              exit 1
            fi
          fi
          if [ "$snapshot_version_now" -gt "$snapshot_version_before" ]; then
            snapshot_bump="This release raises the profile snapshot version: approve your profiles again after installing."
          else
            snapshot_bump=""
          fi
          cd out
          shasum -a 256 ward-darwin-arm64 > ward-darwin-arm64.sha256
          sha256="$(cut -d' ' -f1 ward-darwin-arm64.sha256)"
          cdhash="$(node ../scripts/macho-cdhash.mjs ward-darwin-arm64)"
          {
            echo "Ward ${REF_NAME}, local developer preview, macOS on Apple silicon."
            echo
            echo "- Source: ${SOURCE_SHA}"
            echo "- sha256 ward-darwin-arm64: ${sha256}"
            echo "- cdhash (ad-hoc signature, macOS keychain trust follows it): ${cdhash}"
            echo
            echo "Install and upgrade: https://github.com/${REPO}/blob/${REF_NAME}/docs/runbooks/install-and-upgrade-ward-from-a-release.md"
            if [ -n "$snapshot_bump" ]; then
              echo "$snapshot_bump"
            fi
            echo "Published as a full Release, not a GitHub pre-release: it is the only release for this tag, and the install steps download it by tag. It is still a local developer preview with no stability promise."
            echo "Expect one keychain re-approval per upgrade; the binary is ad-hoc signed."
          } > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ward-darwin-arm64
          path: |
            out/ward-darwin-arm64
            out/ward-darwin-arm64.sha256
            out/release-notes.md
          if-no-files-found: error

  # WCLI-185 (DEC-301 item 1, the design in docs/reference/developer-id-signing-
  # and-notarization-path-draft-for-acceptance.md): the Developer ID signature
  # and Apple's notarization. This is the only job that references the signing
  # secrets, and the only one that runs nothing but pinned actions, Apple's
  # tools, the runner's node and this repository's own scripts: no package
  # manager, so no dependency install script runs beside the key. It re-signs the
  # build job's ad-hoc artifact, notarizes it, checks the designated requirement,
  # regenerates the checksum and the notes' hashes from the re-signed bytes and
  # uploads them as ward-darwin-arm64-signed; verify, attest and release act on
  # that artifact only. The environment is the operator's protection (required
  # reviewer, deployment targets v* and main); the job runs on a tag push and on a
  # manual run from main, which publishes nothing because release is tag-only.
  # Entitlements: none (DEC-301 (a3)); one is added only on a cited failing
  # rehearsal. The identifier ai.opum.ward never changes. The smoke test of the
  # signed binary runs in verify, never here: this job holds the signing key until
  # its cleanup, and a compiled binary carries dependency code.
  sign:
    name: Sign and notarize on macOS
    needs: build
    if: (github.event_name == 'push' && github.ref_type == 'tag') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: macos-15
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ward-darwin-arm64
          path: in
      - name: Import the signing certificate into a temporary keychain
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: bash scripts/signing-keychain.sh import >> "$GITHUB_ENV"
      - name: Re-sign with the Developer ID identity, hardened runtime and a timestamp
        env:
          APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          mkdir out
          cp in/ward-darwin-arm64 out/ward-darwin-arm64
          codesign --force --options runtime --timestamp --identifier ai.opum.ward --keychain "$KEYCHAIN_PATH" --sign "$APPLE_SIGNING_IDENTITY" out/ward-darwin-arm64
          codesign --verify --strict --verbose=2 out/ward-darwin-arm64
      - name: The designated requirement names the team and the identifier
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?the APPLE_TEAM_ID environment variable is not set}"
          if ! [[ $APPLE_TEAM_ID =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::APPLE_TEAM_ID is not a 10-character team id"
            exit 1
          fi
          requirement="$(codesign -d -r- out/ward-darwin-arm64 2>&1 | sed -n 's/^designated => //p')"
          echo "designated requirement: ${requirement}"
          # The team id is the last clause and is matched whole, bare or quoted
          # (codesign quotes a value that starts with a digit).
          case "$requirement" in
            *'identifier "ai.opum.ward"'*'anchor apple generic'*"certificate leaf[subject.OU] = ${APPLE_TEAM_ID}" | *'identifier "ai.opum.ward"'*'anchor apple generic'*"certificate leaf[subject.OU] = \"${APPLE_TEAM_ID}\"") ;;
            *)
              echo "::error::the designated requirement does not name identifier ai.opum.ward, anchor apple generic and team ${APPLE_TEAM_ID} as its last clause"
              exit 1
              ;;
          esac
          case "$requirement" in
            *cdhash*)
              echo "::error::the designated requirement is a bare cdhash: the binary was not signed with the Developer ID identity"
              exit 1
              ;;
          esac
      - name: Notarize and require Accepted
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          key="${RUNNER_TEMP}/ward-notary-key.p8"
          (umask 077; printf '%s' "$ASC_API_KEY_P8" > "$key")
          ditto -c -k out/ward-darwin-arm64 "${RUNNER_TEMP}/ward-notary.zip"
          # A non-zero exit on an Invalid submission must not end the step before
          # the log is kept, so capture the exit code and decide from the status.
          submit_rc=0
          xcrun notarytool submit "${RUNNER_TEMP}/ward-notary.zip" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --output-format json > "${RUNNER_TEMP}/notary.json" || submit_rc=$?
          status="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).status" "${RUNNER_TEMP}/notary.json" || echo unknown)"
          id="$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8')).id" "${RUNNER_TEMP}/notary.json" || echo unknown)"
          echo "notarization ${id}: ${status}"
          if [ "$status" != "Accepted" ] || [ "$submit_rc" -ne 0 ]; then
            xcrun notarytool log "$id" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" || true
            echo "::error::notarization ended ${status} (notarytool exit ${submit_rc}), not Accepted"
            exit 1
          fi
      - name: Regenerate the checksum and the notes' hashes from the signed bytes
        run: |
          set -euo pipefail
          signed="$(codesign -dvvv out/ward-darwin-arm64 2>&1 | sed -n 's/^CDHash=//p')"
          computed="$(node scripts/macho-cdhash.mjs out/ward-darwin-arm64)"
          echo "codesign CDHash=${signed} macho-cdhash=${computed}"
          if [ -z "$signed" ] || [ "$signed" != "$computed" ]; then
            echo "::error::codesign and scripts/macho-cdhash.mjs disagree on the cdhash"
            exit 1
          fi
          node scripts/regenerate-release-metadata.mjs out/ward-darwin-arm64 in/release-notes.md out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ward-darwin-arm64-signed
          path: |
            out/ward-darwin-arm64
            out/ward-darwin-arm64.sha256
            out/release-notes.md
          if-no-files-found: error
      - name: Remove the keychain and every decoded credential file
        if: always()
        run: bash scripts/signing-keychain.sh cleanup

  # WCLI-96 (W-1, DEC-253): the release is gated on macOS's own verdict on the
  # signature. The build job signs and checks the asset itself (WCLI-123); this
  # job is the independent re-check, because a published v0.1.0 whose sha256
  # matched its manifest still failed `codesign --verify --strict`. Once the
  # repository is public it downloads the exact artifact the release would
  # publish, on a GitHub-hosted macOS runner (a self-hosted one is not used for
  # a repository that is public), and the release job needs it, so a signature
  # that does not verify cannot be published. It runs on a release tag and on a
  # dispatch from main (the signing rehearsal, DEC-253 (a1), DEC-301 (a3)); only
  # the release job is tag-only, so a rehearsal can never publish.
  #
  # While the repository is private (DEC-253 (a2), WCLI-120) this job runs on the
  # self-hosted Linux runner and only logs why the hosted re-check is skipped,
  # and the gate is the publish runbook's strict verify of the downloaded
  # Release after the tag. It still runs, so the release job's needs is met
  # without a status function in its condition. The build job, by contrast, is
  # on macos-15 whatever the visibility (DEC-253 (a4)); the key below is this
  # job's alone. The visibility is read from the event's repository payload and
  # fails closed: only an explicit `private == true` skips, so a payload without
  # the field takes the public, verifying path. After the flip the same
  # expression resolves to macos-15 with no edit.
  verify:
    name: Verify the code signature on macOS
    needs: [build, sign]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_type == 'tag')
    runs-on: ${{ github.event.repository.private == true && fromJSON('["self-hosted","Linux","ARM64"]') || 'macos-15' }}
    timeout-minutes: 10
    permissions: {}
    steps:
      - name: The hosted macOS check is skipped while the repository is private
        if: github.event.repository.private == true
        run: |
          echo "::notice::codesign --verify --strict is skipped here while the repository is private (DEC-253 (a2)). The gate is the publish runbook's strict verify of the downloaded Release after the tag; it is required here again once the repository is public."
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: github.event.repository.private != true
        with:
          name: ward-darwin-arm64-signed
          path: out
      - name: codesign verifies the signature strictly
        if: github.event.repository.private != true
        run: codesign --verify --strict --verbose=2 out/ward-darwin-arm64
      - name: The signed binary starts and reports a version
        if: github.event.repository.private != true
        run: |
          set -euo pipefail
          chmod +x out/ward-darwin-arm64
          version="$(out/ward-darwin-arm64 --version)"
          echo "ward --version: ${version}"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::the signed binary did not print a version"
              exit 1
              ;;
          esac

  attest:
    # WCLI-109 (W-15, ruling W-36): build provenance for the artifact the Release
    # publishes. The sha256 and cdhash in the notes come from the same release as
    # the binary, so anything that can replace one can replace all three; a signed
    # attestation made by this workflow's identity, checked with
    # `gh attestation verify`, is the proof that does not live beside the file. It
    # is its own job so the job that holds contents: write never holds id-token,
    # and the only job that can mint an attestation (id-token and attestations:
    # write) can write nothing else. It attests the exact artifact the verify job
    # re-checked and the release job publishes, and release needs it, so a
    # release cannot publish without one. The real attestation exists only when
    # the operator runs a release: a manual dry run does not reach this job.
    name: Attest the build provenance
    needs: [build, sign, verify]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ward-darwin-arm64-signed
          path: out
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/ward-darwin-arm64

  release:
    name: Create the GitHub Release
    needs: [build, sign, verify, attest]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    # DEC-301 (a3): one environment, deployment targets v* and main, the
    # operator as required reviewer, administrator bypass off
    # (docs/runbooks/protect-the-release-path.md). It binds only a job that
    # names it, and this file is the tagged commit's own, so it is a second
    # lock for the operator's click, not a defence against a writer. Until the
    # operator creates it with that protection, GitHub creates an unprotected
    # environment on first use, so create it before the first tag.
    environment: release
    # The only write permission in this workflow: it creates the Release.
    permissions:
      contents: write
    steps:
      # The script that publishes comes from the tagged commit, not the artifact.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ward-darwin-arm64-signed
          path: out
      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          (cd out && sha256sum --check ward-darwin-arm64.sha256)
          node scripts/publish-release.mjs out/release-notes.md \
            out/ward-darwin-arm64 out/ward-darwin-arm64.sha256
